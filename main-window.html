<!doctype html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rinsford's Portfolio</title>
            <!--The link codes process: the first link is to connect to google fonts.
                The second link is to connect to the font file server.
                The third link is to load the VT323 font. -->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

            <!---This code is to make this file copy the coded style on the css file. --->
            <link rel="stylesheet" href="window.css">
        </head>


        <body>
            <!--The code for the terminal ">"-->
            <div class="terminal-input-wrapper">
                <span class="prompt-symbol">></span>
                <input type="text" class="terminal-input" placeholder="Type a command..." autofocus>
            </div>

            <div class="terminal-output"></div>

            <!--The code for the Popup Window (Hidden until triggered)-->
            <div id="popup-window" class="hidden">

                <!--The header of the popup window-->
                <div id="popup-header">
                    <span class="popup-title">About Me</span>

                    <!--The close button for the popup window-->
                    <button id="close-popup" class="close-button">✕</button>
                </div>

                <!--The content of the popup window (About Me)-->
                <div id="popup-content">

                    <!--The embed HTML file-->
                    <iframe src="about-me-popup/about-me.html" style="border: none;" class="popup-iframe"></iframe>
                </div>

                <!--The content of the popup window (Projects)-->
                <div id="popup-content-projects" class="hidden">
                    <iframe src="projects-popup/projects.html" style="border: none;" class="popup-iframe"></iframe>
                </div>

                <!--The content of the popup window (Contact)-->
                <div id="popup-content-contact" class="hidden">
                    <iframe src="contact-popup/contact.html" style="border: none;" class="popup-iframe"></iframe>
                </div>
            </div>

            <!---This code is to make this file copy the coded animation on the JavaScript file. --->
            <script src="script.js"></script>
        </body>
    </html>
